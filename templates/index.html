<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕵️ 伪装目标检测演示</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
h1 { text-align: center; font-size: 32px; margin-bottom: 6px; }
.sub { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
.upload { border: 2px dashed #475569; border-radius: 16px; padding: 50px; text-align: center; cursor: pointer; transition: all 0.3s; background: #1e293b; }
.upload:hover { border-color: #38bdf8; background: #24344d; }
.upload .icon { font-size: 48px; }
.upload p { margin-top: 10px; color: #94a3b8; }
.loading { text-align: center; padding: 30px; font-size: 18px; color: #38bdf8; }
.results { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
.card { flex: 1; min-width: 280px; background: #1e293b; border-radius: 12px; padding: 16px; }
.card h3 { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
.card img { width: 100%; border-radius: 8px; display: block; }
.meta { text-align: center; margin-top: 20px; color: #38bdf8; font-size: 14px; }
.badge { display: inline-block; background: #064e3b; color: #6ee7b7; padding: 2px 10px; border-radius: 999px; font-size: 12px; margin-left: 6px; }
.error { color: #f87171; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>🕵️ 伪装目标检测演示 <span class="badge">SINet-V2 改进版</span></h1>
  <p class="sub">PVTv2-B2 + CBAM 骨干 · 上传图片自动分割伪装目标</p>

  <div class="upload" id="upload">
    <div class="icon">📤</div>
    <p>点击或拖拽图片到此处上传</p>
    <p style="font-size:12px;color:#64748b">支持 JPG / PNG（≤15MB），建议包含伪装目标（动物、昆虫等）</p>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="loading" id="loading" style="display:none">⏳ 模型推理中，请稍候...</div>
  <div class="error" id="error" style="display:none"></div>

  <div class="results" id="results" style="display:none">
    <div class="card">
      <h3>🖼 输入原图</h3>
      <img id="imgOrig" alt="original">
    </div>
    <div class="card">
      <h3>🎯 分割结果</h3>
      <img id="imgResult" alt="result">
    </div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<script>
const upload = document.getElementById("upload");
const fileInput = document.getElementById("file");
const loading = document.getElementById("loading");
const results = document.getElementById("results");
const meta = document.getElementById("meta");
const errDiv = document.getElementById("error");
let origUrl = null;

upload.onclick = () => fileInput.click();
upload.ondragover = e => { e.preventDefault(); upload.style.borderColor = "#38bdf8"; };
upload.ondragleave = () => { upload.style.borderColor = "#475569"; };
upload.ondrop = e => {
  e.preventDefault();
  upload.style.borderColor = "#475569";
  if (e.dataTransfer.files.length) sendFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files.length) sendFile(fileInput.files[0]); };

function showError(msg) {
  errDiv.textContent = msg;
  errDiv.style.display = "block";
}

async function sendFile(file) {
  errDiv.style.display = "none";
  if (!file.type.startsWith("image/")) { showError("请上传图片文件"); return; }
  if (file.size > 15 * 1024 * 1024) { showError("图片过大，请选择 15MB 以内的图片"); return; }

  // show original locally via object URL
  if (origUrl) URL.revokeObjectURL(origUrl);
  origUrl = URL.createObjectURL(file);
  document.getElementById("imgOrig").src = origUrl;

  loading.style.display = "block";
  results.style.display = "none";
  meta.textContent = "";
  try {
    const resp = await fetch("/predict", { method: "POST", body: file });
    const data = await resp.json();
    loading.style.display = "none";
    if (data.status === "ok") {
      results.style.display = "flex";
      document.getElementById("imgResult").src = "data:image/png;base64," + data.result;
      meta.textContent = "✅ 推理完成 · 耗时 " + data.time_ms + " ms · " + file.name;
    } else {
      showError("推理失败: " + data.message);
    }
  } catch (err) {
    loading.style.display = "none";
    showError("请求失败: " + err);
  }
}
</script>
</body>
</html>
